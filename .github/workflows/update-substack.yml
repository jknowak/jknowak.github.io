name: Update Substack posts

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_substack.py
      - name: Commit and rebuild Pages if posts changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/substack.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/substack.json
          git commit -m "Update Substack posts"
          git push
          # Pushes made with GITHUB_TOKEN may not trigger a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
